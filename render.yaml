# myshowroom by Peverelli Design — Blueprint Render
# Dati e file su Supabase (progetto myshowroom): servono solo 3 valori da inserire.
# Render → New → Blueprint → peverellidesign/Myshowroom → ramo myshowroom-v2
services:
  - type: web
    name: myshowroom
    runtime: node
    plan: free               # "starter" per tenerla sempre attiva (niente pausa dopo 15 minuti)
    region: frankfurt
    branch: myshowroom-v2
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        value: https://beloxozizadllxvdxvpb.supabase.co
      - key: SUPABASE_SECRET_KEY   # Supabase → Project Settings → API Keys → Secret key (sb_secret_…)
        sync: false
      - key: ADMIN_EMAIL           # la tua email di accesso
        sync: false
      - key: ADMIN_PASSWORD        # almeno 10 caratteri
        sync: false
      - key: ADMIN_NAME
        value: Direzione Peverelli
      - key: APP_SECRET
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: SEED_DEMO
        value: "true"
