# One-click deploy on Render (Blueprint):
# https://render.com/deploy?repo=https://github.com/peverellidesign/Myshowroom
# Creates the web app, a PostgreSQL database and a persistent disk for PDFs and photos.
# On first start the app runs the migrations and imports the real catalogue.
databases:
  - name: myshowroom-db
    databaseName: myshowroom
    user: myshowroom
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: myshowroom
    runtime: node
    plan: starter # a persistent disk requires a paid instance
    region: frankfurt
    branch: claude/myshowroom-app
    buildCommand: npm ci && npm run build
    startCommand: npm run start:railway
    healthCheckPath: /login
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: myshowroom-db
          property: connectionString
      - key: STORAGE_DIR
        value: /data
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_PASSWORD
        generateValue: true
